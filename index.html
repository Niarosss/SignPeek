        <h1>SignPeek — Сервіс миттєвого перегляду підписаних документів</h1>
        <p>SignPeek дозволяє безпечно переглядати файли P7S, ASiC-E, PDF, DOCX та інші підписані контейнери онлайн.</p>
        
        <h2>Основні можливості:</h2>
        <ul>
          <li>Перевірка цифрових підписів (КЕП / ЕЦП, CAdES, XAdES) прямо у браузері.</li>
          <li>Видобування та розпаковка вмісту контейнерів ASiC-E та архівів ZIP.</li>
          <li>Перегляд документів PDF, Word (DOCX) без передачі на сервер.</li>
          <li>Локальна обробка: файли не передаються в мережу й обробляються виключно на вашому пристрої.</li>
        </ul>

        <h2>Як відкрити файл P7S або ASiC-E?</h2>
        <p>Перетягніть ваш підписаний файл у вікно браузера, скористайтеся комбінацією Ctrl+V або оберіть файл через кнопку завантаження.</p>
        
        <h2>Чому варто використовувати SignPeek?</h2>
        
        <article>
          <h3>Конфіденційність та безпека</h3>
          <p>Всі операції з криптографії та розпакування виконуються локально. Ваші документи не завантажуються на наші сервери, що унеможливлює витік конфіденційних даних.</p>
        </article>
        
        <article>
          <h3>Офлайн-робота</h3>
          <p>Завдяки технології PWA, після першого завантаження сторінки ви можете перевіряти підписи та відкривати файли (P7S, ASiC-E) навіть без підключення до інтернету.</p>
        </article>
